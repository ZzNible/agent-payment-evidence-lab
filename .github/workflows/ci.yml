name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node.js 22
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build distributable CLI
        run: npm run build

      - name: Smoke-test compiled CLI
        run: npm run smoke:dist

      - name: Generate all scenario dossiers
        run: npm run demo

      - name: Verify generated examples
        run: npm run verify:examples

      - name: Verify committed example dossiers
        run: npm run verify:committed
